<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GreenGo connects you across cultures — practice languages with real people, meet locals and travelers, and discover events near you.">

  <!-- PWA theme color -->
  <meta name="theme-color" content="#0A0A0A">

  <!-- PWA / iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GreenGo">
  <link rel="apple-touch-icon" href="icons/Icon-180.png?v=01c33da8">

  <!--
    TODO (Track E follow-up): iOS PWA splash screens.
    iOS requires one <link rel="apple-touch-startup-image"> per device
    resolution & orientation, gated by a media query. The PNGs do NOT
    exist yet and must be generated (deep black #0A0A0A bg + gold logo)
    as a separate step, then wired here. Device portrait sizes needed:

      - iPhone SE / 8 / 7 / 6s ....... 750 x 1334   (@2x, 375x667)
      - iPhone 8+ / 7+ / 6s+ ......... 1242 x 2208   (@3x, 414x736)
      - iPhone X / XS / 11 Pro / 12 mini / 13 mini . 1125 x 2436 (@3x)
      - iPhone XR / 11 .............. 828 x 1792    (@2x)
      - iPhone XS Max / 11 Pro Max .. 1242 x 2688   (@3x)
      - iPhone 12 / 12 Pro / 13 / 14 / 13 Pro . 1170 x 2532 (@3x)
      - iPhone 12/13 Pro Max / 14 Plus . 1284 x 2778 (@3x)
      - iPhone 14 Pro / 15 / 15 Pro .. 1179 x 2556  (@3x)
      - iPhone 14 Pro Max / 15 Pro Max / 15 Plus . 1290 x 2796 (@3x)
      - iPad mini / Air / 9.7" ....... 1536 x 2048   (@2x)
      - iPad Pro 11" ................. 1668 x 2388   (@2x)
      - iPad Pro 12.9" ............... 2048 x 2732   (@2x)

    Example (once PNGs exist):
    <link rel="apple-touch-startup-image"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
          href="splash/apple-splash-1170-2532.png">
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=b9c74d5b"/>

  <title>GreenGo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    PWA install bridge.

    `beforeinstallprompt` fires before Flutter boots, and the event is only
    usable if we preventDefault() and keep a reference to it. So this shim runs
    in <head>, stashes the event, and exposes a tiny API that the Dart side
    (lib/core/platform/pwa_install_web.dart) reads once the app is up.

    Chrome does not fire the event on a fixed schedule -- it lands once the
    manifest, icons and service worker have all been validated, which is
    routinely AFTER the first screen has rendered. Sampling `canPrompt()` once
    therefore misses it, so `whenReady()` lets the caller wait for it.

    iOS has no install API at all -- Safari has never shipped
    `beforeinstallprompt` -- so there `platform()` reports the browser and the
    app shows "Share -> Add to Home Screen" instructions instead of a button.
  -->
  <script>
    (function () {
      var deferred = null;
      var installed = false;
      var waiters = [];

      function detectPlatform() {
        var ua = navigator.userAgent || '';
        var iOS = /iPad|iPhone|iPod/.test(ua) ||
          // iPadOS 13+ reports itself as a Mac; touch points give it away.
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (iOS) {
          // Add to Home Screen is only reliable in Safari proper. Chrome,
          // Firefox, Edge and Opera on iOS all identify themselves first.
          var thirdParty = /CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
          return thirdParty ? 'ios-other' : 'ios-safari';
        }
        if (/Android/.test(ua)) return 'android';
        return 'other';
      }

      function session(key, value) {
        try {
          if (value === undefined) return sessionStorage.getItem(key);
          sessionStorage.setItem(key, value);
        } catch (e) {
          // Private mode / storage disabled -- treat as "never dismissed".
        }
        return null;
      }

      window.__ggInstall = {
        platform: detectPlatform,
        canPrompt: function () { return deferred !== null; },
        installed: function () { return installed; },
        isStandalone: function () {
          return (window.matchMedia &&
                  window.matchMedia('(display-mode: standalone)').matches) ||
                 window.navigator.standalone === true;
        },
        dismissed: function () { return session('gg_install_dismissed') === '1'; },
        dismiss: function () { session('gg_install_dismissed', '1'); },

        // Resolves true as soon as a deferred prompt exists, false if none has
        // arrived within timeoutMs. Callers poll this instead of canPrompt()
        // so a late event still produces an install offer.
        whenReady: function (timeoutMs) {
          if (deferred !== null) return Promise.resolve(true);
          if (installed) return Promise.resolve(false);
          return new Promise(function (resolve) {
            var settled = false;
            function finish(value) {
              if (settled) return;
              settled = true;
              resolve(value);
            }
            waiters.push(finish);
            setTimeout(function () { finish(deferred !== null); }, timeoutMs);
          });
        },

        // Readable state dump for debugging install problems from DevTools.
        debug: function () {
          return JSON.stringify({
            platform: detectPlatform(),
            hasDeferredPrompt: deferred !== null,
            installed: installed,
            standalone: window.__ggInstall.isStandalone(),
            dismissedThisSession: window.__ggInstall.dismissed(),
            hasServiceWorker: 'serviceWorker' in navigator,
            secureContext: window.isSecureContext
          });
        },

        prompt: function () {
          if (!deferred) return Promise.resolve('unavailable');
          var event = deferred;
          // A deferred prompt is single-use; drop it before awaiting so a
          // double tap can't call prompt() on a spent event.
          deferred = null;
          try {
            event.prompt();
          } catch (e) {
            return Promise.resolve('unavailable');
          }
          return event.userChoice.then(function (choice) {
            return (choice && choice.outcome) || 'dismissed';
          }).catch(function () { return 'dismissed'; });
        }
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        var pending = waiters;
        waiters = [];
        pending.forEach(function (fn) { fn(true); });
      });

      window.addEventListener('appinstalled', function () {
        installed = true;
        deferred = null;
        var pending = waiters;
        waiters = [];
        pending.forEach(function (fn) { fn(false); });
      });
    })();
  </script>

  <!--
    Boot screen. Flutter web paints nothing until the engine has downloaded and
    rendered its first frame, and the default document background is white, so
    the app opened on a white flash. This paints the brand black immediately
    (inline, so it costs no extra round trip) and reports real download
    progress while main.dart.js streams in.
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #0A0A0A; }
    #gg-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0A0A0A;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 350ms ease;
    }
    #gg-splash.gg-hide { opacity: 0; pointer-events: none; }
    #gg-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
    }
    #gg-bar {
      position: relative;
      width: 216px;
      height: 4px;
      border-radius: 2px;
      background: rgba(212, 175, 55, 0.18);
      overflow: hidden;
    }
    #gg-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 2px;
      background: linear-gradient(90deg, #D4AF37, #FFD700);
      transition: width 180ms ease-out;
    }
    /* Until the total size is known the bar sweeps instead of filling. */
    #gg-bar.gg-indeterminate #gg-fill {
      width: 40%;
      animation: gg-sweep 1200ms ease-in-out infinite;
    }
    @keyframes gg-sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    #gg-label {
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.2px;
      min-height: 16px;
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) {
      #gg-bar.gg-indeterminate #gg-fill { animation-duration: 3s; }
      #gg-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div id="gg-splash" role="status" aria-label="Loading GreenGo">
    <img src="icons/Icon-192.png?v=558eae4a" alt="">
    <div id="gg-bar" class="gg-indeterminate"><div id="gg-fill"></div></div>
    <div id="gg-label"></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    (function () {
      var splash = document.getElementById('gg-splash');
      var bar = document.getElementById('gg-bar');
      var fill = document.getElementById('gg-fill');
      var label = document.getElementById('gg-label');
      var torn = false;

      // Pre-Flutter UI cannot reach the ARB bundle, so carry the two words it
      // needs for the languages the app ships.
      var COPY = {
        en: ['Downloading', 'Starting'],
        de: ['Wird geladen', 'Wird gestartet'],
        es: ['Descargando', 'Iniciando'],
        fr: ['Telechargement', 'Demarrage'],
        it: ['Download in corso', 'Avvio'],
        pt: ['A transferir', 'A iniciar']
      };
      var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var words = COPY[lang] || COPY.en;

      function mb(bytes) { return (bytes / 1048576).toFixed(1); }

      function setProgress(received, total) {
        if (!label) return;
        if (total > 0) {
          if (bar) bar.classList.remove('gg-indeterminate');
          var pct = Math.max(0, Math.min(100, received / total * 100));
          if (fill) fill.style.width = pct.toFixed(1) + '%';
          label.textContent =
            words[0] + '  ' + mb(received) + ' / ' + mb(total) + ' MB';
        } else {
          label.textContent = words[0] + '  ' + mb(received) + ' MB';
        }
      }

      // Download finished: hand the bar over to engine startup, which has no
      // measurable progress of its own.
      function finishProgress() {
        if (bar) bar.classList.remove('gg-indeterminate');
        if (fill) fill.style.width = '100%';
        if (label) label.textContent = words[1] + '...';
      }

      function teardown() {
        if (torn) return;
        torn = true;
        if (!splash) return;
        splash.classList.add('gg-hide');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }

      // -- progress ---------------------------------------------------------
      // Observational only: the engine loads main.dart.js through its own
      // <script> tag, and Chrome serves both that and this fetch from a single
      // network request (verified against a local server -- one GET per load).
      // Reading the stream is the only way to get byte-level progress, since
      // Firebase serves it Brotli-encoded with chunked transfer and therefore
      // no Content-Length.
      function trackProgress() {
        if (!window.fetch || !window.ReadableStream) return;

        // Stamped by tools/stamp_boot_size.py after `flutter build web`.
        var total = 0; /*GG_BOOT_BYTES*/

        fetch('main.dart.js')
          .then(function (res) {
            if (!res.ok || !res.body || !res.body.getReader) {
              throw new Error('not streamable');
            }
            var reader = res.body.getReader();
            var received = 0;
            setProgress(0, total);
            return (function pump() {
              return reader.read().then(function (chunk) {
                if (chunk.done) return;
                received += chunk.value.length;
                setProgress(received, total);
                return pump();
              });
            })();
          })
          .catch(function () {
            // Cosmetic only -- the engine loads the entrypoint regardless.
          });
      }

      // -- boot -------------------------------------------------------------
      trackProgress();

      _flutter.loader.load({
        onEntrypointLoaded: function (engineInitializer) {
          finishProgress();
          return engineInitializer.initializeEngine().then(function (appRunner) {
            return appRunner.runApp();
          }).then(function () {
            // runApp() resolves once the first frame is scheduled; wait two
            // frames so the engine has actually painted before we fade out,
            // otherwise the splash gives way to a blank black screen.
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { setTimeout(teardown, 80); });
            });
          });
        }
      });

      // Belt and braces: this engine build does not reliably fire
      // `flutter-first-frame`, but if it ever does, take it.
      window.addEventListener('flutter-first-frame', teardown);
      // Absolute backstop: never strand anyone behind the splash.
      setTimeout(teardown, 30000);
    })();
  </script>
  <script>
    // Register our own service worker for PWA installability.
    //
    // Flutter's generated flutter_service_worker.js is now a stub that calls
    // self.registration.unregister() and ships no fetch handler, so after its
    // first activation the site has no service worker and Chrome will not offer
    // to install the app. This registration is separate and unaffected by that.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('pwa_service_worker.js').catch(function (e) {
          console.warn('PWA service worker registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
