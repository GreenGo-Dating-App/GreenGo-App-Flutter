<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    No viewport-fit=cover.

    With it, iOS extends the web view into the unsafe areas when the PWA runs
    standalone, and the bottom row of the app lands inside the home-indicator
    gesture strip, where the system swallows taps -- the bottom nav simply
    stops working. Flutter web cannot compensate: it never populates
    MediaQuery.padding from CSS env(safe-area-inset-*), so the app's SafeArea
    widgets add nothing on this platform. Letting the browser inset the
    viewport instead is the one place that reliably knows the insets.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GreenGo connects you across cultures — practice languages with real people, meet locals and travelers, and discover events near you.">

  <!-- PWA theme color -->
  <meta name="theme-color" content="#0A0A0A">

  <!-- PWA / iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black", not "black-translucent": translucent puts the app underneath
       the status bar, clipping the top the same way cover clipped the bottom. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GreenGo">
  <link rel="apple-touch-icon" href="icons/Icon-180.png?v=01c33da8">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=b9c74d5b"/>

  <title>GreenGo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    PWA install bridge.

    `beforeinstallprompt` fires before Flutter boots, and the event is only
    usable if we preventDefault() and keep a reference to it. So this shim runs
    in <head>, stashes the event, and exposes a tiny API that the Dart side
    (lib/core/platform/pwa_install_web.dart) reads once the app is up.

    Chrome does not fire the event on a fixed schedule -- it lands once the
    manifest, icons and service worker have all been validated, which is
    routinely AFTER the first screen has rendered. Sampling `canPrompt()` once
    therefore misses it, so `whenReady()` lets the caller wait for it.

    iOS has no install API at all -- Safari has never shipped
    `beforeinstallprompt` -- so there `platform()` reports the browser and the
    app shows "Share -> Add to Home Screen" instructions instead of a button.
  -->
  <script>
    (function () {
      var deferred = null;
      var installed = false;
      var waiters = [];

      function detectPlatform() {
        var ua = navigator.userAgent || '';
        var iOS = /iPad|iPhone|iPod/.test(ua) ||
          // iPadOS 13+ reports itself as a Mac; touch points give it away.
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (iOS) {
          // Add to Home Screen is only reliable in Safari proper. Chrome,
          // Firefox, Edge and Opera on iOS all identify themselves first.
          var thirdParty = /CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
          return thirdParty ? 'ios-other' : 'ios-safari';
        }
        if (/Android/.test(ua)) return 'android';
        return 'other';
      }

      function session(key, value) {
        try {
          if (value === undefined) return sessionStorage.getItem(key);
          sessionStorage.setItem(key, value);
        } catch (e) {
          // Private mode / storage disabled -- treat as "never dismissed".
        }
        return null;
      }

      window.__ggInstall = {
        platform: detectPlatform,
        canPrompt: function () { return deferred !== null; },
        installed: function () { return installed; },
        isStandalone: function () {
          return (window.matchMedia &&
                  window.matchMedia('(display-mode: standalone)').matches) ||
                 window.navigator.standalone === true;
        },
        dismissed: function () { return session('gg_install_dismissed') === '1'; },
        dismiss: function () { session('gg_install_dismissed', '1'); },

        // Resolves true as soon as a deferred prompt exists, false if none has
        // arrived within timeoutMs. Callers poll this instead of canPrompt()
        // so a late event still produces an install offer.
        whenReady: function (timeoutMs) {
          if (deferred !== null) return Promise.resolve(true);
          if (installed) return Promise.resolve(false);
          return new Promise(function (resolve) {
            var settled = false;
            function finish(value) {
              if (settled) return;
              settled = true;
              resolve(value);
            }
            waiters.push(finish);
            setTimeout(function () { finish(deferred !== null); }, timeoutMs);
          });
        },

        // Readable state dump for debugging install problems from DevTools.
        debug: function () {
          return JSON.stringify({
            platform: detectPlatform(),
            hasDeferredPrompt: deferred !== null,
            installed: installed,
            standalone: window.__ggInstall.isStandalone(),
            dismissedThisSession: window.__ggInstall.dismissed(),
            hasServiceWorker: 'serviceWorker' in navigator,
            secureContext: window.isSecureContext
          });
        },

        prompt: function () {
          if (!deferred) return Promise.resolve('unavailable');
          var event = deferred;
          // A deferred prompt is single-use; drop it before awaiting so a
          // double tap can't call prompt() on a spent event.
          deferred = null;
          try {
            event.prompt();
          } catch (e) {
            return Promise.resolve('unavailable');
          }
          return event.userChoice.then(function (choice) {
            return (choice && choice.outcome) || 'dismissed';
          }).catch(function () { return 'dismissed'; });
        }
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        var pending = waiters;
        waiters = [];
        pending.forEach(function (fn) { fn(true); });
      });

      window.addEventListener('appinstalled', function () {
        installed = true;
        deferred = null;
        var pending = waiters;
        waiters = [];
        pending.forEach(function (fn) { fn(false); });
      });
    })();
  </script>

  <!--
    Restart diagnostics + new-version detection.

    1. Every boot records why this page (re)started: a normal navigation, a
       reload (user F5, or the browser reloading a tab it killed for memory --
       iOS Safari does this silently), or a restore of a tab the browser
       discarded in the background (`document.wasDiscarded`, Chrome/Android).
       The record lives in sessionStorage so consecutive boots in one tab are
       linked; Dart reads `__ggBootInfo` and logs it. This is the only way to
       tell "the app restarted by itself" apart in the field.

    2. A deploy is detected by polling version.json (no-store). It NEVER
       reloads the page by itself -- it only notifies Dart, which shows a
       dismissible "new version available" banner. `apply()` reloads once per
       target build per tab: if the reload still boots the old build (stale
       edge cache), that build is never offered again in this tab, so a
       refresh loop is impossible.
  -->
  <script>
    (function () {
      function ss(key, value) {
        try {
          if (value === undefined) return sessionStorage.getItem(key);
          if (value === null) sessionStorage.removeItem(key);
          else sessionStorage.setItem(key, value);
        } catch (e) {}
        return null;
      }

      // -- restart diagnostics ---------------------------------------------
      var now = Date.now();
      var navType = 'navigate';
      try {
        var entry = performance.getEntriesByType('navigation')[0];
        if (entry && entry.type) navType = entry.type;
      } catch (e) {}
      var boots = [];
      try { boots = JSON.parse(ss('gg_boot_log') || '[]') || []; } catch (e) {}
      var selfReload = ss('gg_self_reload');
      ss('gg_self_reload', null);
      var info = {
        navType: navType,
        wasDiscarded: document.wasDiscarded === true,
        selfReload: selfReload === '1',
        bootsThisTab: boots.length + 1,
        sinceLastBootMs: boots.length ? now - boots[boots.length - 1] : -1
      };
      boots.push(now);
      ss('gg_boot_log', JSON.stringify(boots.slice(-10)));
      window.__ggBootInfo = info;
      if ((navType === 'reload' || info.wasDiscarded) && !info.selfReload) {
        console.warn('[GreenGo] page restarted: ' + JSON.stringify(info));
      }

      // -- new-version detection -------------------------------------------
      var POLL_MS = 15 * 60 * 1000;     // while the tab is visible
      var RESUME_MIN_MS = 5 * 60 * 1000; // re-check on return, at most this often
      var bootBuild = null;
      var latestBuild = null;
      var lastCheck = 0;
      var listeners = [];
      var notified = false;

      function readBuild() {
        return fetch('version.json?gg=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            return j && j.version ? String(j.version) + '+' + String(j.build_number || '') : null;
          })
          .catch(function () { return null; });
      }

      function check() {
        lastCheck = Date.now();
        return readBuild().then(function (build) {
          if (!build) return;
          if (bootBuild === null) { bootBuild = build; return; }
          if (build === bootBuild) return;
          // Already reloaded for this build in this tab and still running the
          // old one: never offer it again here (no loops).
          if (ss('gg_update_tried') === build) return;
          latestBuild = build;
          if (notified) return;
          notified = true;
          listeners.forEach(function (fn) { try { fn(build); } catch (e) {} });
        });
      }

      // Baseline: the build that was live as this page booted.
      check();
      setInterval(function () {
        if (document.visibilityState === 'visible') check();
      }, POLL_MS);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' &&
            Date.now() - lastCheck > RESUME_MIN_MS) {
          check();
        }
      });

      window.__ggUpdate = {
        bootBuild: function () { return bootBuild; },
        latestBuild: function () { return latestBuild; },
        // Registers a callback for "a newer build is live". Fires at most once
        // per page; fires immediately if one was already seen.
        onAvailable: function (fn) {
          if (typeof fn !== 'function') return;
          listeners.push(fn);
          if (notified && latestBuild) { try { fn(latestBuild); } catch (e) {} }
        },
        // User-initiated only (the banner's Refresh button).
        apply: function () {
          if (!latestBuild) return false;
          if (ss('gg_update_tried') === latestBuild) return false;
          ss('gg_update_tried', latestBuild);
          ss('gg_self_reload', '1');
          window.location.reload();
          return true;
        },
        bootInfo: function () { return JSON.stringify(window.__ggBootInfo || {}); }
      };
    })();
  </script>

  <!--
    Screenshot / screen-capture DETERRENTS (web).

    A browser page CANNOT block screenshots: OS shortcuts (Win+Shift+S,
    Cmd+Shift+4), phone cameras and screen recorders never reach the page.
    What this shim does is best effort, and documented as such
    (lib/core/security/screen_security_service.dart):

      * blur the app the instant the window loses focus or the tab is hidden
        (most snipping tools take focus first, so they capture a blurred
        page); Dart adds an opaque cover on top of it;
      * PrintScreen: clear the clipboard where the browser permits it;
      * Ctrl/Cmd+P (print), Ctrl/Cmd+S (save page), Ctrl+Shift+S (Firefox
        screenshot) are swallowed; printing renders a blank page;
      * no context menu ("Save image as"), drag-out or iOS long-press callout
        on images / video / the Flutter canvas.

    Focus moving into an <iframe> inside the page (embedded video, captcha)
    also fires window "blur"; that is not "leaving the app", so it is ignored.
    Dart attaches with __ggScreenGuard.attach(fn) and receives: blur, focus,
    hidden, visible, printscreen, print, save. setEnabled(false) is the
    remote kill-switch.
  -->
  <style>
    img, video, canvas, flt-glass-pane, flutter-view {
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }
    img, video { user-select: none; -webkit-user-select: none; }
    html.gg-obscured flutter-view,
    html.gg-obscured flt-glass-pane {
      filter: blur(28px);
    }
    @media print {
      html, body { display: none !important; visibility: hidden !important; }
    }
  </style>
  <script>
    (function () {
      var enabled = true;
      var handler = null;
      var root = document.documentElement;

      function emit(type) {
        if (!handler) return;
        try { handler(type); } catch (e) {}
      }
      function obscure(on) {
        if (on && !enabled) return;
        if (on) root.classList.add('gg-obscured');
        else root.classList.remove('gg-obscured');
      }
      function focusInFrame() {
        var a = document.activeElement;
        return !!a && a.tagName === 'IFRAME';
      }
      function toast(type) { if (enabled) emit(type); }

      window.addEventListener('blur', function () {
        // Let the activeElement settle first: it becomes the iframe only
        // after the blur event.
        setTimeout(function () {
          if (focusInFrame() || document.hasFocus()) return;
          obscure(true);
          emit('blur');
        }, 0);
      });
      window.addEventListener('focus', function () {
        if (document.visibilityState !== 'hidden') obscure(false);
        emit('focus');
      });
      document.addEventListener('visibilitychange', function () {
        var hidden = document.visibilityState === 'hidden';
        obscure(hidden);
        emit(hidden ? 'hidden' : 'visible');
      });

      window.addEventListener('keyup', function (e) {
        if (!enabled) return;
        if (e.key === 'PrintScreen' || e.keyCode === 44) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText('').catch(function () {});
            }
          } catch (err) {}
          toast('printscreen');
        }
      }, true);
      window.addEventListener('keydown', function (e) {
        if (!enabled) return;
        var mod = e.ctrlKey || e.metaKey;
        var k = (e.key || '').toLowerCase();
        if (e.key === 'PrintScreen') {
          // Some browsers deliver keydown only; hide immediately.
          obscure(true);
          setTimeout(function () { if (document.hasFocus()) obscure(false); }, 1500);
          return;
        }
        if (mod && k === 'p') { e.preventDefault(); e.stopPropagation(); toast('print'); }
        else if (mod && k === 's' && e.shiftKey) { e.preventDefault(); e.stopPropagation(); toast('printscreen'); }
        else if (mod && k === 's') { e.preventDefault(); e.stopPropagation(); toast('save'); }
      }, true);
      window.addEventListener('beforeprint', function () { obscure(true); toast('print'); });
      window.addEventListener('afterprint', function () { if (document.hasFocus()) obscure(false); });

      function isEditable(t) {
        if (!t || !t.tagName) return false;
        var tag = t.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || t.isContentEditable;
      }
      document.addEventListener('contextmenu', function (e) {
        if (enabled && !isEditable(e.target)) e.preventDefault();
      }, true);
      document.addEventListener('dragstart', function (e) {
        if (enabled && !isEditable(e.target)) e.preventDefault();
      }, true);

      window.__ggScreenGuard = {
        attach: function (fn) { handler = typeof fn === 'function' ? fn : null; },
        setEnabled: function (on) {
          enabled = on !== false;
          if (!enabled) root.classList.remove('gg-obscured');
        },
        isEnabled: function () { return enabled; }
      };
    })();
  </script>

  <!--
    Boot screen. Flutter web paints nothing until the engine has downloaded and
    rendered its first frame, and the default document background is white, so
    the app opened on a white flash. This paints the brand black immediately
    (inline, so it costs no extra round trip) and shows which boot phase is
    running (downloading, then starting) without requesting anything itself.
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #0A0A0A; }
    #gg-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0A0A0A;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 350ms ease;
    }
    #gg-splash.gg-hide { opacity: 0; pointer-events: none; }
    #gg-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
    }
    #gg-bar {
      position: relative;
      width: 216px;
      height: 4px;
      border-radius: 2px;
      background: rgba(212, 175, 55, 0.18);
      overflow: hidden;
    }
    #gg-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 2px;
      background: linear-gradient(90deg, #D4AF37, #FFD700);
      transition: width 180ms ease-out;
    }
    /* While main.dart.js downloads the bar sweeps; it fills once the engine starts. */
    #gg-bar.gg-indeterminate #gg-fill {
      width: 40%;
      animation: gg-sweep 1200ms ease-in-out infinite;
    }
    @keyframes gg-sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    #gg-label {
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.2px;
      min-height: 16px;
      font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) {
      #gg-bar.gg-indeterminate #gg-fill { animation-duration: 3s; }
      #gg-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div id="gg-splash" role="status" aria-label="Loading GreenGo">
    <img src="icons/Icon-192.png?v=558eae4a" alt="">
    <div id="gg-bar" class="gg-indeterminate"><div id="gg-fill"></div></div>
    <div id="gg-label"></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    (function () {
      var splash = document.getElementById('gg-splash');
      var bar = document.getElementById('gg-bar');
      var fill = document.getElementById('gg-fill');
      var label = document.getElementById('gg-label');
      var torn = false;

      // Pre-Flutter UI cannot reach the ARB bundle, so carry the two words it
      // needs for the languages the app ships.
      var COPY = {
        en: ['Downloading', 'Starting'],
        de: ['Wird geladen', 'Wird gestartet'],
        es: ['Descargando', 'Iniciando'],
        fr: ['Telechargement', 'Demarrage'],
        it: ['Download in corso', 'Avvio'],
        pt: ['A transferir', 'A iniciar']
      };
      var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var words = COPY[lang] || COPY.en;

      // Phase 1 -- downloading: the bar sweeps (indeterminate, its initial
      // class) and the label names the phase.
      function startProgress() {
        if (label) label.textContent = words[0] + '...';
      }

      // Download finished: hand the bar over to engine startup, which has no
      // measurable progress of its own.
      function finishProgress() {
        if (bar) bar.classList.remove('gg-indeterminate');
        if (fill) fill.style.width = '100%';
        if (label) label.textContent = words[1] + '...';
      }

      function teardown() {
        if (torn) return;
        torn = true;
        if (!splash) return;
        splash.classList.add('gg-hide');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }

      // -- progress ---------------------------------------------------------
      // Phase-based, not byte-based, and deliberately issues NO request of
      // its own. It used to fetch('main.dart.js') in parallel with the
      // engine's <script> tag to stream byte progress, on the assumption that
      // the browser would share one network request. It does not: Chrome
      // downloaded the ~9 MB entrypoint twice on every load (once for the
      // script, once for this cosmetic fetch). The engine loads main.dart.js
      // exactly once; onEntrypointLoaded below marks the end of that phase.
      // -- boot -------------------------------------------------------------
      startProgress();

      // Dart calls this from AuthWrapper's first frame, i.e. the moment a real
      // branded screen is actually on the display.
      //
      // Tearing down on runApp() instead was wrong: it resolves as soon as the
      // first frame is *scheduled*, while the engine is still compositing and
      // Firebase auth has not resolved, so the loader gave way to a black
      // screen and the user sat looking at nothing until the login page
      // finally appeared. Waiting for this signal keeps one continuous branded
      // loading state from first paint through to the login page.
      window.__ggBoot = {
        ready: function () {
          requestAnimationFrame(function () { teardown(); });
        }
      };

      // -- engine resources: same-origin only -----------------------------
      // By default the engine downloads CanvasKit and Roboto + the Noto
      // fallback fonts (emoji, CJK, Arabic, ...) from Google's CDNs, which
      // hands every visitor's IP address to Google without consent (GDPR;
      // LG Muenchen I, 3 O 17493/20). Instead:
      //  - CanvasKit is served from this origin (build with
      //    --no-web-resources-cdn; the explicit base URL below keeps it local
      //    even if someone builds without the flag),
      //  - fallback fonts come from /gfonts/s/..., which Firebase Hosting
      //    rewrites to the fontFallbackProxy function (server-side fetch,
      //    CDN-cached).
      // tools/web/build_web.sh fails the build if either regresses.
      var engineConfig = {
        canvasKitBaseUrl: 'canvaskit/',
        fontFallbackBaseUrl: '/gfonts/s/'
      };

      _flutter.loader.load({
        config: engineConfig,
        onEntrypointLoaded: function (engineInitializer) {
          finishProgress();
          return engineInitializer.initializeEngine(engineConfig).then(function (appRunner) {
            return appRunner.runApp();
          }).then(function () {
            // If Dart never signals -- an exception before the first screen
            // builds, say -- do not hold the loader for the full backstop.
            setTimeout(teardown, 15000);
          });
        }
      });

      // Belt and braces: this engine build does not reliably fire
      // `flutter-first-frame`, but if it ever does, take it.
      window.addEventListener('flutter-first-frame', teardown);
      // Absolute backstop: never strand anyone behind the splash.
      setTimeout(teardown, 25000);
    })();
  </script>
  <script>
    // Register our own service worker for PWA installability.
    //
    // Flutter's generated flutter_service_worker.js is now a stub that calls
    // self.registration.unregister() and ships no fetch handler, so after its
    // first activation the site has no service worker and Chrome will not offer
    // to install the app. This registration is separate and unaffected by that.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('pwa_service_worker.js').catch(function (e) {
          console.warn('PWA service worker registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
