name: security

# Security gates (P4). Runs on every PR and on every push to main.
# Make the "security / gate" check REQUIRED on main (Settings -> Branches ->
# Branch protection -> Require status checks). See docs/security/ci.md for what
# each job checks, why, and how to run it locally.
#
# No secret is needed or used: emulators run against fake projects, the
# gitignored Firebase config files are replaced by placeholders, and no job
# can reach production.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_history_secret_scan:
        description: "Also scan the FULL git history for secrets (slow, informational)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FIREBASE_TOOLS_VERSION: "15.8.0"   # the version the suites were validated with
  FIREBASE_WEB_SDK_VERSION: "12.6.0" # same as greengo-admin-panel/package-lock.json
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64 tarball
  FLUTTER_VERSION: "3.44.4"          # same as codemagic.yaml

jobs:
  # (a) Cloud Functions: clean install, type-check, dependency audit.
  functions:
    name: functions (tsc + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npx tsc -p . --noEmit
      - name: npm audit (critical = blocking, high = report only)
        run: python3 ../tools/security/npm_audit_gate.py

  # (b) Security regression suites against the local emulators only.
  emulator-suites:
    name: emulator security suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install firebase-tools (pinned)
        run: npm install -g --no-audit --no-fund "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: npm ci (functions)
        working-directory: functions
        run: npm ci --no-audit --no-fund
      # The rules client tests use the Firebase WEB SDK, exactly like the apps.
      # It is not a functions dependency, so install it OUTSIDE functions/
      # (functions/package.json and its lockfile stay untouched) and expose it
      # through NODE_PATH. firebase-admin still resolves from functions/.
      - name: Install Firebase web SDK for the rules client tests
        run: |
          mkdir -p "$RUNNER_TEMP/websdk"
          cd "$RUNNER_TEMP/websdk"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "firebase@${FIREBASE_WEB_SDK_VERSION}"
          echo "NODE_PATH=$RUNNER_TEMP/websdk/node_modules" >> "$GITHUB_ENV"
      - name: Jest security suites (functions/__tests__/security/*.emulator.test.ts)
        working-directory: functions
        # The jest setup (functions/__tests__/setup.ts) pins GCLOUD_PROJECT to
        # "test-project", so the emulators must use that id or ID tokens are
        # rejected. No credentials exist in CI: nothing can reach a real project.
        run: >-
          firebase emulators:exec --only firestore,auth,storage --project test-project
          "npx jest --config jest.security.config.js --ci"
      # Each rules client script signs up fixed users (alice@example.com ...),
      # so each one gets a fresh emulator. demo-* ids never touch real services.
      - name: Firestore rules client test (phase0)
        working-directory: functions
        run: >-
          firebase emulators:exec --only firestore,auth --project demo-ci
          "node __tests__/security/phase0.rules.emulator.js"
      - name: Storage rules client test (media)
        working-directory: functions
        run: >-
          firebase emulators:exec --only firestore,auth,storage --project demo-ci
          "node __tests__/security/media.rules.emulator.js"
      - name: Firestore rules client test (privacy)
        working-directory: functions
        run: >-
          firebase emulators:exec --only firestore,auth --project demo-ci
          "node __tests__/security/privacy.rules.emulator.js"

  # (c) Secret scanning with gitleaks (CLI; gitleaks-action needs a paid
  # licence for organisation-owned repos). Config: .gitleaks.toml.
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the commits of this PR / push
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] \
               && ! echo "${{ github.event.before }}" | grep -qE '^0+$' \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="-1 ${{ github.sha }}"
          fi
          echo "Scanning commits: $range"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$range"
      - name: Scan every tracked file at HEAD
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"; mkdir -p "$tree"
          git archive HEAD | tar -x -C "$tree"
          cp .gitleaks.toml "$tree/.gitleaks.toml"
          cd "$tree"
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Full history scan (manual runs only, informational)
        if: github.event_name == 'workflow_dispatch' && inputs.full_history_secret_scan
        continue-on-error: true
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # (d) function-name ownership + (e) legal documents manifest.
  policy:
    name: policy (function ownership + legal manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: No app export of a web-owned Cloud Function
        run: python tools/security/check_function_ownership.py
      - name: Legal documents match tools/security/legal_manifest.json
        run: python tools/security/check_legal_manifest.py

  # (f) Flutter static analysis + tests, with placeholder Firebase config.
  flutter:
    name: flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Placeholder Firebase config (gitignored files)
        run: bash tools/security/ci_stub_firebase_config.sh
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze (fail on errors only)
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt || true
          if grep -qE '^\s*error (-|•) ' analyze.txt; then
            echo "::error::Analyzer reported ERROR-severity issues"
            grep -E '^\s*error (-|•) ' analyze.txt
            exit 1
          fi
          if ! grep -qE 'issues? found|No issues found' analyze.txt; then
            echo "::error::flutter analyze did not complete"; exit 1
          fi
          echo "No error-severity analyzer issues."
      - name: flutter test
        run: flutter test

  # Single required check for branch protection.
  gate:
    name: gate
    if: always()
    needs: [functions, emulator-suites, secrets, policy, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: All security jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::At least one security job did not pass"; exit 1
          fi
